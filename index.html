eight:650}.pill{font-size:11px;color:#166534;background:#dcfce7;border-radius:20px;padding:5px 9px}.topline{display:flex;justify-content:space-between;align-items:center;gap:8px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:white;border:1px solid #e2e8f0;border-radius:13px;padding:14px 6px;text-align:center}.stat strong{display:block;color:#172554;font-size:23px}.stat small{color:#64748b;font-size:10px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;display:flex;background:white;border-top:1px solid #e2e8f0;padding:8px}.nav button{flex:1;border:0;background:white;color:#475569;padding:9px 2px;font-size:12px}.nav button.active{color:#1e40af;font-weight:800}.countrow{background:white;border:1px solid #e2e8f0;border-radius:14px;padding:12px;margin:9px 0}.countrow>strong{display:block;margin-bottom:9px}.lanes{display:grid;grid-template-columns:1fr 1fr;gap:10px}.lane{display:grid;grid-template-columns:38px 1fr 38px;align-items:center;gap:4px}.lane button{border:0;border-radius:9px;background:#172554;color:white;font-size:23px;height:43px}.lane button.minus{background:#fee2e2;color:#b91c1c}.lane output{text-align:center;font-size:20px;font-weight:800}.subline{font-size:12px;color:#64748b;margin:6px 0}.message{font-size:12px;color:#475569;background:#e0f2fe;padding:12px;border-radius:10px;margin-top:12px}.section{font-size:12px;letter-spacing:.5px;font-weight:800;color:#64748b;margin:22px 0 9px}
.toggleline{display:flex;align-items:center;gap:10px;font-size:14px;margin:8px 0}.toggleline input{width:22px;height:22px;margin:0;flex-shrink:0;accent-color:#172554}.lanes.single{grid-template-columns:1fr}.lane button:disabled{opacity:.35;cursor:not-allowed}.countrow .lane{grid-template-columns:44px 1fr 48px}.countrow .lane button{min-height:46px}
/* Fase 3: contador compacto, adaptable y con objetivos táctiles amplios */

input:read-only{background:#f1f5f9}

.counter-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.counter-head h1{font-size:clamp(15px,3.8vw,20px);margin:0;overflow-wrap:anywhere}

.counter-total b{display:block;font-size:22px}.counter-total small{font-size:10px}
.interval{background:#e0f2fe;color:#0c4a6e;border-radius:9px;padding:6px 9px;font-size:11px;margin:6px 0}

.counter-grid:not(.one-lane) .countrow{padding:12px;margin:0}
.counter-grid:not(.one-lane) .countrow>strong{font-size:15px;min-height:26px;margin-bottom:10px}
.counter-grid:not(.one-lane) .countrow>strong span{font-size:22px}

.counter-grid:not(.one-lane) .lane button{min-height:54px;height:54px;font-size:27px}
.counter-grid:not(.one-lane) .lane output{font-size:21px}
.report h2{font-size:16px;margin:20px 0 10px}.report-grand{font-weight:900;font-size:24px;color:#172554;margin-top:10px}.table-scroll{overflow-x:auto;background:white;border-radius:12px;border:1px solid #e2e8f0}.report table{width:100%;border-collapse:collapse;font-size:12px}.report th,.report td{padding:9px 7px;border-bottom:1px solid #e2e8f0;text-align:right;white-space:nowrap}.report th:first-child,.report td:first-child{text-align:left}.report thead,.report tfoot{background:#eff6ff;color:#172554}.report-buttons{display:grid;gap:9px;margin-top:20px}
@media(max-width:370px){.counter-grid:not(.one-lane) .lanes{gap:5px}.counter-grid:not(.one-lane) .lane{grid-template-columns:minmax(37px,1fr) minmax(20px,.5fr) minmax(37px,1fr)}}

.worker-group{display:flex;align-items:center;justify-content:space-between;gap:10px}.worker-group strong{font-size:16px}.worker-group .subline{margin:5px 0 0}.aforo-status{font-weight:800;font-size:12px;color:#15803d}.aforo-status.done{color:#475569}.delete-aforo{margin-top:9px;background:#fff!important;color:#b91c1c!important;border:1px solid #fecaca!important}.delete-aforo:active{background:#fee2e2!important}

.status{display:inline-block;border-radius:999px;padding:5px 10px;font-size:11px;font-weight:800;background:#fef3c7;color:#92400e}.status.ok{background:#dcfce7;color:#166534}.status.no{background:#fee2e2;color:#991b1b}.small-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.small-actions .btn{flex:1;padding:10px 7px;font-size:12px}.card h3{margin:0 0 8px;font-size:15px}.demo-banner{font-size:12px;background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:11px;color:#9a3412;margin:12px 0}.label-info{font-size:12px;color:#64748b;margin:8px 0}.status-line{display:flex;justify-content:space-between;gap:8px;align-items:center}
</style><meta name="theme-color" content="#172554"></head><body><div class="app"><header class="header"><div class="brand"><div class="mark" aria-label="ConsulTraffic">CT</div><div><strong>ConsulTraffic App</strong><small id="subtitle">Sistema de conteo vehicular</small></div></div><button id="exit" class="exit hidden">Salir</button></header><main id="view" aria-live="polite"></main><nav id="nav" class="nav hidden"></nav></div><script>
'use strict';
// Fase 17: inicio OWNER con Firebase; colaboradores y aforos siguen en demostración local.
const view=document.querySelector('#view'),nav=document.querySelector('#nav'),exit=document.querySelector('#exit'),subtitle=document.querySelector('#subtitle');
const categories=[['🚶','Peatón'],['🏍️','Motocicleta'],['🚗','Vehículo'],['🛻','Pickup'],['🚐','Camión liviano'],['🚚','Camión'],['🚌','Autobús'],['🚛','Tráiler']];
const KEY='consultraffic_fase2_local';
const ACCESS_KEY='consultraffic_f12_access_demo';
const blank=()=>categories.map(()=>[0,0]);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const clock=ms=>new Date(ms).toLocaleTimeString('es-SV',{hour:'2-digit',minute:'2-digit',hour12:true});
const nextBoundary=ms=>Math.floor(ms/900000)*900000+900000;
let role=null,tab='inicio',job=null,notice='',history=[],series={},selectedReport=null,selectedWorker=null;
let access={session:null,requests:[],workerId:null};
try{const x=JSON.parse(localStorage.getItem(ACCESS_KEY)||'null');if(x&&Array.isArray(x.requests))access={session:x.session||null,requests:x.requests,workerId:x.workerId||null};}catch(e){}
function saveAccess(){try{localStorage.setItem(ACCESS_KEY,JSON.stringify(access))}catch(e){notice='No se pudo guardar el acceso en este navegador.'}}
function myRequest(){return access.requests.find(x=>x.id===access.workerId)||null}
function requestStatus(x){if(!x)return 'sin solicitud';if(x.status==='approved'&&x.until&&Date.now()>x.until)return 'expired';return x.status}
function dateText(t){return t?new Date(t).toLocaleString('es-SV'):'Sin vencimiento'}
function isWorkerAuthorized(){return requestStatus(myRequest())==='approved'}
function accessGuard(){if(role==='worker'&&!isWorkerAuthorized()){tab='inicio';return false}return true}

try {const stored=JSON.parse(localStorage.getItem(KEY)||'null');if(stored&&stored.version>=2){job=stored.job||null;history=Array.isArray(stored.history)?stored.history:[];series=stored.series||{};}}catch(e){console.warn('No se pudo recuperar la demostración',e)}
function persist(){try{localStorage.setItem(KEY,JSON.stringify({version:3,job,history,series}))}catch(e){notice='No se pudo guardar en este navegador. Evita cerrar la página.'}}
function button(label,action,cls=''){return `<button type="button" class="btn ${cls}" data-action="${action}">${label}</button>`}
function totals(data){return data.reduce((s,x)=>[s[0]+x[0],s[1]+x[1]],[0,0])}
function overall(){if(!job)return [0,0];const all=job.blocks.reduce((s,b)=>{const t=totals(b.counts);return [s[0]+t[0],s[1]+t[1]]},[0,0]);const now=totals(job.counts);return [all[0]+now[0],all[1]+now[1]]}
function roll(now=Date.now()){
 if(!job||!job.active)return;
 let changed=false;
 while(job.active&&job.boundary<=now){
   job.blocks.push({start:job.start,end:job.boundary,counts:job.counts.map(x=>x.slice()),partial:job.start%900000!==0});
   job.start=job.boundary;job.boundary+=900000;job.counts=blank();changed=true;
 }
 if(changed)persist();
}
function showOwnerLogin(error=''){role=null;subtitle.textContent='Acceso seguro del propietario';exit.classList.add('hidden');nav.classList.add('hidden');view.innerHTML=`<h1>Acceso administrador</h1><p class="muted">Ingresa con la cuenta OWNER registrada en Firebase.</p><div class="card"><label for="ownerEmail">Correo electrónico</label><input id="ownerEmail" type="email" autocomplete="username" placeholder="correo@ejemplo.com"><label for="ownerPassword">Contraseña</label><input id="ownerPassword" type="password" autocomplete="current-password"><button class="btn wide" data-action="firebase-login">Iniciar sesión</button><div class="btnrow"><button class="btn secondary" data-action="firebase-reset">Recuperar contraseña</button><button class="btn secondary" data-action="back-welcome">Volver</button></div><p id="loginMessage" class="muted" role="status">${esc(error)}</p></div>`}
window.ctOwnerAuthChanged=(ok,error)=>{if(ok){role='owner';tab='inicio';access.session=null;saveAccess();render()}else if(role==='owner'||document.querySelector('#ownerEmail')){role=null;showOwnerLogin(error||'Cuenta no autorizada como propietario.')}};
function welcome(){subtitle.textContent='Sistema de conteo vehicular';exit.classList.add('hidden');nav.classList.add('hidden');view.innerHTML=`<h1>Bienvenido</h1><p class="muted">Selecciona cómo deseas ingresar.</p><button class="choice" data-action="owner"><span class="symbol">🛡️</span><span><b>Administrador</b><small>Panel de control y reportes</small></span></button><button class="choice" data-action="worker"><span class="symbol">👷</span><span><b>Colaborador</b><small>Proyectos y conteo vehicular</small></span></button>`}
function enter(r){if(r==='owner'&&!window.ctOwnerAuthenticated){showOwnerLogin();return}role=r;tab='inicio';access.session=r;saveAccess();render()}
function requestView(){const r=myRequest();const s=requestStatus(r);return `<h1>Acceso de colaborador</h1><div class="demo-banner">Demostración local: esta solicitud solo existe en este navegador. No es una autorización real ni funciona entre teléfonos.</div>${r?`<div class="card"><h3>${esc(r.name)}</h3><span class="status ${s==='approved'?'ok':s==='rejected'||s==='revoked'||s==='expired'?'no':''}">${s==='pending'?'Pendiente de aprobación':s==='approved'?'Autorizado':s==='expired'?'Autorización vencida':s==='revoked'?'Acceso revocado':'Solicitud rechazada'}</span><p class="label-info">${s==='approved'?'Válido hasta: '+dateText(r.until):'El administrador puede aprobar desde este mismo dispositivo de prueba.'}</p>${s==='approved'?button('Entrar a mis conteos','worker-dashboard','wide green'):button('Enviar nueva solicitud','request-form','wide secondary')}</div>`:`<div class="card"><h3>Solicitar autorización</h3><label for="workerName">Nombre del colaborador</label><input id="workerName" maxlength="65" placeholder="Nombre y apellido">${button('Enviar solicitud','request-access','wide')}</div>`}`}

function render(){if(role==='owner'&&!window.ctOwnerAuthenticated){role=null;showOwnerLogin();return}if(!role)return welcome();roll();subtitle.textContent=role==='owner'?'Panel administrador':'Trabajo de campo';exit.classList.remove('hidden');nav.classList.remove('hidden');const tabs=role==='owner'?[['inicio','Inicio'],['aforos','Aforos'],['usuarios','Usuarios'],['ajustes','Ajustes']]:[['inicio','Inicio'],['conteo','Conteo'],['misaforos','Mis aforos'],['perfil','Perfil']];nav.innerHTML=tabs.map(([id,name])=>`<button data-tab="${id}" class="${tab===id?'active':''}">${name}</button>`).join('');view.innerHTML=(role==='owner'?ownerView():(accessGuard()?workerView():requestView()));}
function workerName(id){return access.requests.find(r=>r.id===id)?.name||'Colaborador sin identificar'}
function workerJobs(id){return history.filter(h=>h.workerId===id)}
function ownerAforos(){
 const ids=[...new Set([...access.requests.map(r=>r.id),...history.map(h=>h.workerId||'legacy'),...(job?.active?[job.workerId||'legacy']:[])])];
 if(!ids.length)return '<div class="card">Aún no hay colaboradores ni aforos en este dispositivo.</div>';
 if(tab==='aforos'&&selectedWorker){
  const id=selectedWorker,items=workerJobs(id).slice().reverse(),current=job?.active&&(job.workerId||'legacy')===id?job:null;
  return `<h1>${esc(id==='legacy'?'Aforos anteriores':workerName(id))}</h1><p class="muted">Aforos realizados y en proceso</p>${button('← Volver a colaboradores','aforos-back','wide secondary')}${current?`<div class="card"><div class="status-line"><b>${esc(current.name)}</b><span class="aforo-status">● En proceso</span></div><p class="subline">${current.lanes} carril(es) · Desde ${dateText(current.blocks[0]?.start||current.start)}</p><p class="subline">Total registrado: ${overall()[0]+overall()[1]} vehículos. Solo consulta; el conteo sigue activo en el dispositivo.</p><button type="button" class="btn wide delete-aforo" data-delete-active="1">Eliminar aforo en proceso</button></div>`:''}${items.map(h=>`<div class="card"><div class="status-line"><b>${esc(h.name)}</b><span class="aforo-status done">Finalizado</span></div><p class="subline">${h.total} vehículos · ${dateText(h.finished)}</p><button class="btn wide" data-admin-report="${esc(String(h.id||h.finished))}">Ver reporte y PDF</button><button type="button" class="btn wide delete-aforo" data-delete-aforo="${esc(String(h.id||h.finished))}">Eliminar aforo</button></div>`).join('')||(!current?'<div class="card">Este colaborador todavía no tiene aforos.</div>':'')}`;
 }
 return `<h1>Aforos por colaborador</h1><p class="muted">Selecciona un colaborador para consultar sus aforos.</p>${ids.map(id=>{const n=workerJobs(id).length,ongoing=job?.active&&(job.workerId||'legacy')===id;return `<button type="button" class="choice" data-worker-folder="${esc(id)}"><span class="symbol">👷</span><span><b>${esc(id==='legacy'?'Aforos anteriores sin asignar':workerName(id))}</b><small>${n} finalizado(s)${ongoing?' · 1 en proceso':''}</small></span><span aria-hidden="true">›</span></button>`}).join('')}`;
}
function ownerView(){
 const pending=access.requests.filter(r=>requestStatus(r)==='pending');
 const active=access.requests.filter(r=>requestStatus(r)==='approved');
 const rows=access.requests.map(r=>{const status=requestStatus(r);return `<div class="card"><div class="status-line"><h3>${esc(r.name)}</h3><span class="status ${status==='approved'?'ok':status==='pending'?'':'no'}">${status==='pending'?'Pendiente':status==='approved'?'Autorizado':status==='expired'?'Vencido':status==='revoked'?'Revocado':'Rechazado'}</span></div><p class="subline">Solicitud: ${dateText(r.created)}${r.until?'<br>Vence: '+dateText(r.until):''}</p>${status==='pending'?`<label for="days-${esc(r.id)}">Duración de autorización</label><select id="days-${esc(r.id)}"><option value="1">1 día</option><option value="7" selected>7 días</option><option value="30">30 días</option><option value="90">90 días</option></select><div class="small-actions"><button class="btn green" data-approve="${esc(r.id)}">Aprobar</button><button class="btn red" data-reject="${esc(r.id)}">Rechazar</button></div>`:status==='approved'?`<div class="small-actions"><button class="btn red" data-revoke="${esc(r.id)}">Revocar acceso</button></div>`:`<div class="small-actions"><button class="btn secondary" data-renew="${esc(r.id)}">Renovar 7 días</button></div>`}</div>`}).join('');
 const banner='<div class="demo-banner">Sesión OWNER verificada con Firebase. Los aforos, colaboradores y autorizaciones de esta fase siguen siendo datos locales de demostración; aún no se sincronizan entre dispositivos.</div>';
 if(tab==='inicio')return `<h1>Panel administrador</h1>${banner}<div class="stats"><div class="stat"><strong>${active.length}</strong><small>Autorizados</small></div><div class="stat"><strong>${history.length}</strong><small>Aforos locales</small></div><div class="stat"><strong>${pending.length}</strong><small>Solicitudes</small></div></div><div class="card"><h3>Solicitudes de acceso</h3><p class="subline">${pending.length?pending.length+' solicitud(es) esperando aprobación':'No hay solicitudes pendientes.'}</p>${button('Gestionar colaboradores','usuarios','wide')}</div><div class="card"><h3>Aforos guardados en este teléfono</h3><p class="subline">${history.length} aforo(s) finalizados en almacenamiento local.</p>${button('Ver aforos','aforos','wide secondary')}</div>`;
 if(tab==='aforos')return banner+ownerAforos();
 if(tab==='usuarios')return `<h1>Colaboradores</h1>${banner}${rows||'<div class="card">No hay solicitudes todavía. Desde Colaborador puedes crear una solicitud de prueba.</div>'}`;
 if(tab==='detalle')return reportView(history.find(h=>String(h.id||h.finished)===String(selectedReport)));
 return `<h1>Configuración</h1>${banner}<div class="card"><h3>Propietario (OWNER)</h3><p class="muted">La creación de administradores secundarios, las credenciales y la recuperación de acceso se habilitarán al conectar autenticación segura.</p></div>`;
}

// Agrupación por hora de reloj. Cada tramo se atribuye a la hora en que comenzó.
function hourlySummary(h){
 const by=new Map();
 for(const b of (h.blocks||[])){
  const d=new Date(b.start),key=new Date(d.getFullYear(),d.getMonth(),d.getDate(),d.getHours()).getTime();
  const t=totals(b.counts||blank());
  const r=by.get(key)||{key,total:0,a:0,b:0,minutes:0};
  r.a+=t[0];r.b+=t[1];r.total+=t[0]+t[1];
  r.minutes+=Math.max(0,Math.min(60,(b.end-b.start)/60000));by.set(key,r);
 }
 return [...by.values()].sort((a,b)=>a.key-b.key);
}
function hourLabel(ms){const d=new Date(ms),e=new Date(ms+3600000);return clock(d.getTime())+'–'+clock(e.getTime())}
function hourlyChart(h){
 const data=hourlySummary(h),max=Math.max(1,...data.map(x=>x.total));
 if(!data.length)return '<p class="muted">Sin intervalos para graficar.</p>';
 const peak=Math.max(...data.map(x=>x.total));
 return `<div class="card"><h2 style="margin-top:0">Vehículos por hora</h2><p class="subline">Cada barra muestra los vehículos registrados dentro de esa hora. Las horas incompletas se identifican con *.</p><div class="hourchart">${data.map(x=>`<div class="hourrow"><span class="hourlabel">${hourLabel(x.key)}${x.minutes<59.5?' *':''}</span><div class="hourtrack"><div class="hourfill ${x.total===peak&&peak>0?'peak':''}" style="width:${Math.max(0,100*x.total/max)}%"></div></div><b>${x.total}</b></div>`).join('')}</div><p class="subline">Mayor registro: <b>${data.filter(x=>x.total===peak).map(x=>hourLabel(x.key)).join(', ')}</b> (${peak} vehículos). * Hora con cobertura parcial; no es comparable directamente con una hora completa.</p></div>`;
}
